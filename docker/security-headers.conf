# Included into every location block. nginx does not merge add_header across
# levels: a location that sets any add_header stops inheriting the server's,
# so these have to be repeated rather than declared once at server level.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
