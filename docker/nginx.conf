server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Default is 1. Level 6 is the usual sweet spot and matters here because
    # the JSON content files compress very well.
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed filenames, so these can be cached indefinitely — changed content
    # produces a new filename rather than a stale cache. Covers the
    # lazy-loaded route chunks too.
    #
    # Note: `expires` is deliberately not used. It emits its own Cache-Control,
    # which would arrive alongside this one as a duplicate header.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
    }

    # index.html must never be cached, or clients keep requesting chunk names
    # that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # The app uses HashRouter, so routes live after the '#' and never reach
    # nginx. This fallback only matters for a stray direct request.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
